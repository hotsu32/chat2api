<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的账号 · ChatGPT 镜像</title>
  <style>
    :root { --fg:#0f172a; --muted:#64748b; --border:#e2e8f0; --accent:#10a37f; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
           color:var(--fg); background:#f8fafc; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:640px; margin:0 auto; padding:40px 20px; }
    h1 { font-size:22px; letter-spacing:-0.02em; margin:0 0 24px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:24px; margin-bottom:20px; }
    .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .row:last-child { border-bottom:none; }
    .row .k { color:var(--muted); }
    .row .v { font-weight:500; text-align:right; word-break:break-all; }
    .tag { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600;
           background:#ecfdf5; color:var(--accent); }
    .cta { display:inline-block; padding:11px 18px; background:var(--accent); color:#fff; border-radius:10px;
           text-decoration:none; font-weight:600; font-size:14px; }
    .cta:hover { filter:brightness(1.05); }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
    .chip { font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:3px 10px; }
    .muted { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>我的账号</h1>
    <div class="card">
      <div class="row"><span class="k">邮箱</span><span class="v">{{ email }}</span></div>
      <div class="row"><span class="k">档位</span><span class="v"><span class="tag">{{ tier_label }}</span></span></div>
      <div class="row"><span class="k">状态</span><span class="v">{{ status }}</span></div>
      <div class="row">
        <span class="k">额度</span>
        <span class="v">{{ used }} / {{ quota_limit if quota_limit is not none else '不限' }}</span>
      </div>
      <div class="row">
        <span class="k">可用模型</span>
        <span class="v"><div class="chips">{% for m in models %}<span class="chip">{{ m }}</span>{% endfor %}</div></span>
      </div>
      <div class="row"><span class="k">访问链接</span><span class="v muted">/?token={{ seed }}</span></div>
    </div>
    <a class="cta" href="/?token={{ seed }}">进入聊天</a>
    <form method="post" action="/signout" style="display:inline;margin-left:8px;">
      <button type="submit" style="background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:underline;">退出登录</button>
    </form>
  </div>
</body>
</html>
