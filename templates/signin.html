{% extends "base_auth.html" %}
{% block title %}登录 · Chat-Share{% endblock %}
{% block content %}
<div class="brand"><span class="mark"></span>Chat-Share</div>
<p class="sub">登录后进入你的套餐入口。</p>

{% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
{% if error %}<div class="error">{{ error }}</div>{% endif %}

<form method="post" action="/signin">
  <div class="field">
    <label for="email">邮箱</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ email or '' }}" required>
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button class="btn btn-block" type="submit">登录</button>
</form>

<div class="auth-foot">没有账号？<a href="/register">注册</a> · <a href="/forgot-password">忘记密码</a></div>
{% endblock %}
