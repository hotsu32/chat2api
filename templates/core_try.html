<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT 镜像试用入口</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f5;color:#202123;margin:0}.wrap{max-width:760px;margin:8vh auto;padding:24px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0000000b}h1{margin:0 0 8px;font-size:30px}p{color:#6b6b6b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:24px}a{display:block;padding:18px;border:1px solid #ddd;border-radius:12px;color:#202123;text-decoration:none}a:hover{border-color:#10a37f;box-shadow:0 0 0 3px #10a37f1a}.tier{font-weight:650}.alias{font-size:12px;color:#888;margin-top:6px}</style></head><body><main class="wrap"><section class="card"><h1>ChatGPT 镜像试用</h1><p>选择一个真实账号档次进入核心聊天页面，不需要注册或购买套餐。</p><div class="grid">{% for label, token, tier in entries %}<a href="/?token={{ token }}"><div class="tier">{{ label }}</div><div class="alias">{{ tier|upper }} · 独立账号入口</div></a>{% endfor %}</div></section></main></body></html>
